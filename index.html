<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ на Python: практика</title>
<style>
  :root {
    --ink:#16202e; --muted:#5d6978; --line:#d5dbe3; --bg:#f6f7f9;
    --blue:#2c5f93; --sun:#f2c94c; --code:#eaeef3; --warn:#c0392b;
    --soft:#eef2fa;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.6 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap {
    display:grid; grid-template-columns: 15rem minmax(0, 46rem);
    gap:4rem; max-width:68rem; margin:0 auto; padding:3rem 1.5rem 5rem;
  }
  aside { position:sticky; top:3rem; align-self:start; }
  aside .title { font-size:1.35rem; font-weight:700; line-height:1.25; margin:0 0 .4rem; }
  aside .day { color:var(--muted); font-size:.95rem; margin:0 0 1.6rem; }
  aside ol { list-style:none; margin:0; padding:0; border-left:2px solid var(--line); }
  aside li a {
    display:block; padding:.35rem 0 .35rem 1rem; margin-left:-2px;
    border-left:2px solid transparent; color:var(--muted);
    text-decoration:none; font-size:.98rem;
  }
  aside li a:hover { color:var(--ink); border-left-color:var(--blue); }
  aside li a:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }

  h2 { font-size:1.45rem; line-height:1.25; margin:0 0 .6rem; }
  h3 { font-size:1.15rem; margin:1.2rem 0 .5rem; color:var(--blue); }
  section { padding:2.2rem 0; border-top:1px solid var(--line); position:relative; }
  section:first-of-type { border-top:0; padding-top:0; }
  .n { display:block; font-size:.95rem; color:var(--blue); font-weight:600; margin-bottom:.2rem; }
  p { margin:.6rem 0; }
  ul { padding-left:1.2rem; }
  li { margin:.3rem 0; }
  a { color:var(--blue); }
  code {
    font-family:Consolas, "Cascadia Mono", Menlo, monospace;
    font-size:.88em; background:var(--code); padding:.08em .35em; border-radius:3px;
  }
  pre {
    margin:.8rem 0 0; padding:1rem 1.2rem; background:var(--code);
    border-left:4px solid var(--sun); overflow-x:auto;
    font:15px/1.5 Consolas, "Cascadia Mono", Menlo, monospace;
  }
  pre code { background:none; padding:0; font-size:inherit; }

  details { border-top:1px solid var(--line); padding:.7rem 0; }
  details + details { margin-top:0; }
  summary {
    cursor:pointer; font-weight:600; color:var(--blue);
    list-style:none; background:var(--soft); padding:.4rem .8rem; border-radius:6px;
  }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"+"; display:inline-block; width:1.2rem; font-weight:700; }
  details[open] > summary::before { content:"\2212"; }
  details p { color:var(--muted); margin-top:.5rem; }

  .note {
    background:#fef9e3; border-left:4px solid var(--sun);
    padding:.7rem 1rem; margin:1rem 0; border-radius:4px;
  }
  .warn {
    background:#fdecea; border-left:4px solid var(--warn);
    padding:.7rem 1rem; margin:1rem 0; border-radius:4px;
  }
  .task {
    background:var(--soft); border-radius:10px; padding:1.2rem 1.5rem;
    margin:1.5rem 0; border-left:5px solid var(--sun);
  }
  .task h3 { margin-top:0; }
  .intro { color:var(--muted); }
  footer {
    margin-top:2rem; padding-top:1rem; border-top:1px solid var(--line);
    font-size:.9rem; color:var(--muted);
  }
  @media (max-width:860px) {
    .wrap { display:block; padding:1.5rem 1.1rem 4rem; }
    aside { position:static; margin-bottom:2rem; }
    aside ol { display:flex; flex-wrap:wrap; gap:.3rem 1.2rem; border-left:0; }
    aside li a { padding:.2rem 0; border-left:0; margin:0; }
    body { font-size:16px; }
  }
  @media print {
    aside ol, details > summary::before { display:none; }
    details { display:block; }
  }
</style>
<style>
  .wrap { display:block; max-width:44rem; }
  .levels a { display:block; padding:1.2rem 0; border-top:1px solid var(--line); text-decoration:none; color:var(--ink); }
  .levels a:last-child { border-bottom:1px solid var(--line); }
  .levels a:hover b { text-decoration:underline; }
  .levels b { color:var(--blue); font-size:1.2rem; display:block; }
  .levels span { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
<main>
<h1 style="font-size:1.8rem;margin:0 0 .4rem">ИИ на Python: практика</h1>
<p style="color:var(--muted)">Проектирование ИИ-решений на Python</p>

  <a href="ai_python_level1.html"><b>Базовый уровень</b></a>
  <a href="ai_python_level2.html"><b>Повышенный уровень</b></a>
</nav>
<footer>Направление «Проектирование ИИ-решений на Python», УО «Национальный детский технопарк».</footer>
</main>
</div>
</body>
</html>
